name: Build
on: push
jobs:
  build:
    strategy:
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
    runs-on: macos-26
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew update
          brew install binaryen

      - name: Install Typst
        run: |
          TYPST_VERSION=$(perl -ne 'print $& if /\.\s*minimum_typst_version\s*=\s*"\K[^"]+/' build.zig.zon)
          mkdir "$HOME/.local/bin"
          curl -L https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-aarch64-apple-darwin.tar.xz | bsdtar xJf - --strip-components=1 -C "$HOME/.local/bin" */typst
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup zig
        uses: mlugg/setup-zig@v2

      - name: Build
        run: zig build -p "$HOME/Library/Application Support/typst" -Doptimize=${{ matrix.optimize }}

      - name: Test
        run: |
          cd pkg/examples
          typst compile demo.typ

      - name: Pack
        run: |
          VERSION=$(perl -ne 'print $& if /\.\s*version\s*=\s*"\K[^"]+/' build.zig.zon)
          zig build pack -Doptimize=${{ matrix.optimize }}
          mv zig-out/neoplot-${VERSION}.tar.xz neoplot-${{ matrix.optimize }}-${VERSION}+${GITHUB_SHA::7}.tar.xz

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: neoplot-${{ matrix.optimize }}-*.tar.xz
          archive: false
          if-no-files-found: error
